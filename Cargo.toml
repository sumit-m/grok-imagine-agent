[package]
name = "imagine-agent"
version = "0.1.0"
edition = "2021"
description = "Non-LLM Buzz ACP harness that runs the imagine (Grok Imagine) CLI and posts the results"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
